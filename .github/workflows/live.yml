# Prüft nach jeder Veröffentlichung und täglich, ob die Seite unter der Hauptadresse und auf GitHub Pages
# erreichbar ist und aktuelle Daten zeigt. Schlägt die Prüfung fehl, benachrichtigt GitHub per E-Mail
# (Einstellungen → Notifications → Actions: „Notify on failed workflows“).
name: Live-Prüfung

on:
  workflow_run:
    workflows: ["Daten aktualisieren und Seite veröffentlichen"]
    types: [completed]
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      # Ist main inzwischen weiter, folgt ein neuerer Lauf mit eigener Prüfung. Diese Prüfung entfällt dann: Sie
      # würde den älteren Stand mit den Erwartungen des neueren vergleichen, und eine vom neueren Lauf ersetzte
      # Veröffentlichung auf GitHub Pages als Fehler melden (beides am 10.11.2026 geschehen).
      - name: Neuerer Stand auf main?
        id: stand
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then echo "aktuell=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          kopf=$(git ls-remote "https://github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          lauf="${{ github.event.workflow_run.head_sha }}"
          if [ -n "$kopf" ] && [ "$kopf" != "$lauf" ]; then
            echo "::notice::main ist weiter ($lauf → $kopf); die Prüfung folgt nach dem neueren Lauf"
            echo "aktuell=false" >> "$GITHUB_OUTPUT"
          else
            echo "aktuell=true" >> "$GITHUB_OUTPUT"
          fi

      # abgebrochen heißt: ein neuerer Lauf hat ihn ersetzt; dessen Prüfung folgt (keine Fehlermeldung)
      - name: Veröffentlichung abgeschlossen?
        if: steps.stand.outputs.aktuell == 'true' && github.event_name == 'workflow_run' && !contains(fromJSON('["success", "cancelled"]'), github.event.workflow_run.conclusion)
        run: |
          echo "::error::Der Lauf „Daten aktualisieren und Seite veröffentlichen“ endete mit ${{ github.event.workflow_run.conclusion }}"
          exit 1

      # Der eigene Server holt den Branch deploy per Webhook; etwas Zeit lassen
      - name: Warten auf die Bereitstellung
        if: steps.stand.outputs.aktuell == 'true' && github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        run: sleep 180

      - name: Hauptadresse und Spiegel prüfen
        if: steps.stand.outputs.aktuell == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          set -u
          fail=0
          check() {  # Adresse, erwarteter Inhalt
            body=$(curl -fsSL --retry 3 --retry-delay 10 "$1") || { echo "::error::$1 nicht erreichbar"; fail=1; return; }
            echo "$body" | grep -q "$2" || { echo "::error::$1 enthält nicht „$2“"; fail=1; return; }
            echo "ok  $1"
          }
          for base in https://bonn.ratsatlas.de/ https://daimpad.github.io/ratsatlas-bonn/; do
            check "$base" "Ratsatlas"
            check "${base}data/export/bonn/index.json" "generated_at"
            check "${base}datenschutz.html" "Verantwortlich"
          done
          # Unterseiten und Feed über ganz Bonn (seit 01.11.2026; Themen- und Haushaltsseite, Seite rss/, eine Gebietsseite)
          for base in https://bonn.ratsatlas.de/ https://daimpad.github.io/ratsatlas-bonn/; do
            check "${base}rss/" "Inhalte abonnieren und weiterverwenden"
            check "${base}haushalt/" "Investitionsmaßnahmen"
            check "${base}thema/" "<h1>Themen"
            check "${base}ortsteil/endenich/" "Ratsvorlagen in Endenich"
            # interne Links auf die Seiten je Vorgang (seit 13.11.2026; vorher nur über die Sitemap erreichbar)
            check "${base}ortsteil/endenich/" 'href="../../vorgang/'
            check "${base}teilen/" "Bilder zum Ratsatlas Bonn"
            feed="${base}data/export/bonn/feeds/ganz-bonn.xml"
            n=$(curl -fsSL --retry 3 --retry-delay 10 "$feed" | python3 -c 'import sys, xml.etree.ElementTree as ET
          r = ET.parse(sys.stdin).getroot(); a = "{http://www.w3.org/2005/Atom}"
          print(len(r.findall(a + "entry")) if r.tag == a + "feed" else 0)') || n=0
            if [ "${n:-0}" -gt 0 ]; then echo "ok  $feed ($n Einträge)"; else echo "::error::$feed ist kein Atom-Feed mit Einträgen"; fail=1; fi
          done
          # Graue Kartenkacheln (kacheln.yml, seit 02.11.2026); fehlen sie, zeigt die Seite OSM grau gefiltert: nur Hinweis
          for base in https://bonn.ratsatlas.de/ https://daimpad.github.io/ratsatlas-bonn/; do
            if curl -fsSL --retry 3 --retry-delay 10 "${base}kacheln/stand.json" | grep -q '"build"' \
              && curl -fsSIL --retry 3 --retry-delay 10 "${base}kacheln/12/2128/1375.png" > /dev/null; then
              echo "ok  ${base}kacheln/"
            else
              echo "::warning::${base}kacheln/ fehlt oder ist unvollständig (Rückfall auf OSM-Kacheln)"
            fi
          done
          check https://bonn.ratsatlas.de/robots.txt "Sitemap: https://bonn.ratsatlas.de/sitemap.xml"
          check https://bonn.ratsatlas.de/sitemap.xml "<sitemapindex"
          check https://bonn.ratsatlas.de/sitemap-seiten.xml "<urlset"
          # Seiten je Vorgang (seit 09.11.2026): die erste Seite der Sitemap muss erreichbar sein
          check https://bonn.ratsatlas.de/sitemap-vorgaenge.xml "<urlset"
          seite=$(curl -fsSL --retry 3 --retry-delay 10 https://bonn.ratsatlas.de/sitemap-vorgaenge.xml | grep -o '<loc>[^<]*' | head -1 | cut -c6-) || seite=""
          if [ -n "$seite" ]; then check "$seite" "Beratungsfolge"; else echo "::error::sitemap-vorgaenge.xml ohne Seiten"; fail=1; fi
          # IndexNow-Schlüssel (seit 11.11.2026): Datei <schlüssel>.txt mit dem Schlüssel aus pipeline/indexnow.py
          key=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/pipeline/indexnow.py" | sed -n 's/^SCHLUESSEL = "\([0-9a-f]*\)".*/\1/p') || key=""
          if [ -z "$key" ]; then echo "::error::Schlüssel in pipeline/indexnow.py nicht gefunden"; fail=1
          else check "https://bonn.ratsatlas.de/$key.txt" "$key"; fi
          # Datenstand höchstens zwei Tage alt
          stand=$(curl -fsSL https://bonn.ratsatlas.de/data/export/bonn/index.json | python3 -c 'import json,sys;print(json.load(sys.stdin)["meta"]["generated_at"][:10])') || stand=""
          if [ -z "$stand" ] || [ $(( ( $(date -u +%s) - $(date -u -d "$stand" +%s) ) / 86400 )) -gt 2 ]; then
            echo "::error::Datenstand auf bonn.ratsatlas.de ist älter als zwei Tage (${stand:-unbekannt})"; fail=1
          else
            echo "ok  Datenstand $stand"
          fi
          # Holt der eigene Server den Branch deploy ab? Gleicher Stand wie im Branch (21.10.2026: Server blieb
          # elf Stunden auf einem älteren Stand, die Prüfung auf zwei Tage bemerkte es nicht)
          gen() { curl -fsSL "$1?pruefung=$(date +%s)" | python3 -c 'import json,sys;print(json.load(sys.stdin)["meta"]["generated_at"])'; }
          soll=$(gen https://raw.githubusercontent.com/${{ github.repository }}/deploy/data/export/bonn/index.json) || soll=""
          ist=$(gen https://bonn.ratsatlas.de/data/export/bonn/index.json) || ist=""
          if [ -n "$soll" ] && [ "$soll" != "$ist" ]; then
            echo "::error::bonn.ratsatlas.de zeigt den Stand ${ist:-unbekannt}, der Branch deploy $soll – der Server holt den Branch nicht ab (Plesk: Git → Webhook bzw. „Abrufen“)"; fail=1
          else
            echo "ok  Hauptadresse auf dem Stand des Branch deploy ($soll)"
          fi
          exit $fail

      # deploy/htaccess setzt Sicherheitskopfzeilen und CORS; nginx liefert statische Dateien auf der Hauptadresse
      # derzeit ohne sie aus (Plesk, beim Auftraggeber offen). Bis zur Umstellung nur ein Hinweis, kein Fehler.
      - name: Kopfzeilen der Hauptadresse (Hinweis)
        if: steps.stand.outputs.aktuell == 'true' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
        run: |
          # mit GET wie ein Browser: HEAD-Anfragen beantwortet der Server auf einem anderen Weg (mit Kopfzeilen)
          kopf() {  # Adresse, Kopfzeile
            if curl -fsS --retry 3 --retry-delay 10 -D - -o /dev/null "$1" | tr -d '\r' | grep -qi "^$2:"; then echo "ok  $1 $2"
            else echo "::warning::$1 ohne Kopfzeile $2"; fi
          }
          kopf https://bonn.ratsatlas.de/ X-Content-Type-Options
          kopf https://bonn.ratsatlas.de/ Strict-Transport-Security
          kopf https://bonn.ratsatlas.de/data/export/bonn/feeds/ganz-bonn.xml Access-Control-Allow-Origin
          kopf https://bonn.ratsatlas.de/data/export/bonn/index.json Access-Control-Allow-Origin
          # frühere Hauptadresse (bis 04.11.2026): soll mit Pfad dauerhaft auf bonn.ratsatlas.de weiterleiten (Hinweis)
          ziel=$(curl -sS --retry 3 --retry-delay 10 -o /dev/null -w '%{http_code} %{redirect_url}' https://ris-bonn.datenatlas.de/thema/ || true)
          case "$ziel" in
            "301 https://bonn.ratsatlas.de/thema/") echo "ok  ris-bonn.datenatlas.de leitet weiter";;
            *) echo "::warning::ris-bonn.datenatlas.de/thema/ leitet nicht dauerhaft auf bonn.ratsatlas.de/thema/ weiter ($ziel)";;
          esac
          # Strukturdatenatlas der Statistikstelle (data/strukturdaten/, seit 10.11.2026): neuer Stand der Quelle als
          # Hinweis; neu abrufen mit `python -m pipeline strukturdaten` (lokal, auf Knopfdruck)
          neu=$(curl -fsSI --retry 3 --retry-delay 10 https://www2.bonn.de/statistik/Strukturdatenatlas/data.js | tr -d '\r' \
            | sed -n 's/^[Ll]ast-[Mm]odified: //p' | xargs -I{} date -u -d "{}" +%F || true)
          alt=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/data/strukturdaten/meta.json" \
            | python3 -c 'import json,sys;print(json.load(sys.stdin)["datenstand"])' || true)
          if [ -n "$neu" ] && [ -n "$alt" ] && [ "$neu" != "$alt" ]; then
            echo "::warning::Strukturdatenatlas mit neuem Stand $neu (im Repository $alt): python -m pipeline strukturdaten ausführen"
          else echo "ok  Strukturdatenatlas ${alt:-unbekannt}"; fi
          # Aktuelle Geometrie der statistischen Bezirke (stadtplan.bonn.de, OD=4859; am 10.11.2026 nicht erreichbar):
          # Hinweis, sobald sie 65 Flächen liefert und das Repository noch die Kartengeometrie des Atlas nutzt; Übernahme
          # erst nach Vergleich und Freigabe (GEOMETRIE_FREIGEGEBEN in pipeline/strukturdaten.py, Entscheidung 10.11.2026)
          ng=$(curl -fsSL --max-time 120 "https://stadtplan.bonn.de/geojson?OD=4859" \
            | python3 -c 'import json,sys;print(len(json.load(sys.stdin)["features"]))' 2>/dev/null) || ng=""
          gm=$(curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/main/data/strukturdaten/meta.json" \
            | python3 -c 'import json,sys;m=json.load(sys.stdin);print(m.get("geometrie_quelle",""), m.get("geometrie_stadt",""))' || true)
          if [ "${ng:-0}" = "65" ] && [ "${gm%% *}" != "stadtplan" ]; then
            if [ "${gm#* }" = "geprüft" ]; then
              echo "::warning::Geometrie der statistischen Bezirke erreichbar, Vergleich liegt vor (audit_geometrie_vergleich.tsv): Freigabe offen"
            else
              echo "::warning::Geometrie der statistischen Bezirke wieder erreichbar (65 Flächen): python -m pipeline strukturdaten ausführen und den Vergleich prüfen"
            fi
          else echo "ok  Geometrie der statistischen Bezirke (Stadt: ${ng:-nicht erreichbar} Flächen; im Repository: ${gm%% *})"; fi
