# Gebäude für die Seite 3d/ („Bonn in 3D“, Entscheidungen des Auftraggebers 24.11.2026, dreid/phase0/BERICHT.md):
# 3D-Gebäudemodell LoD1 von Geobasis NRW (dl-de/zero-2.0) für Bonn laden und je Ortsteil Grundriss und Höhe ablegen
# (pipeline/gebaeude3d/auszug.py, rund 1,3 GB Download, wenige Minuten). Ablage im Branch `gebaeude` als einzelner
# Commit, der jeweils ersetzt wird; pages.yml übernimmt die Dateien nach 3d/gebaeude/. Vierteljährlich wie die Kacheln
# und auf Knopfdruck; danach startet er pages.yml. Bei Pull Requests, die das Skript ändern, läuft er ohne Ablage.
name: Gebäude für 3D (vierteljährlich und auf Knopfdruck)

on:
  schedule:
    - cron: "41 3 8 1,4,7,10 *"
  workflow_dispatch:
  pull_request:
    paths:
      - "pipeline/gebaeude3d/**"
      - ".github/workflows/gebaeude.yml"

permissions:
  contents: read

concurrency:
  group: "gebaeude"
  cancel-in-progress: false

jobs:
  gebaeude:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write   # Branch gebaeude
      actions: write    # pages.yml danach starten
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: pip install --require-hashes -r requirements.txt

      - name: Gebäude je Ortsteil
        run: python -I pipeline/gebaeude3d/auszug.py data/geo/ortsteile_bonn.geojson _gebaeude/3d/gebaeude

      - name: Branch gebaeude ersetzen (ein Commit, damit der Branch nicht wächst)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd _gebaeude
          git init -q -b gebaeude
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Gebäude LoD1 für Bonn ($(python3 -c 'import json;print(json.load(open("3d/gebaeude/stand.json"))["stand_kacheln"][:10])'))"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" HEAD:gebaeude

      - name: Seite mit den neuen Gebäuden veröffentlichen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages.yml --repo "${{ github.repository }}" --ref main
